name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run portable checks
        run: make check

      - name: Validate GitHub Actions workflows
        run: make lint-actions-docker

      - name: Enforce SwiftLint baseline
        run: make lint-swift-docker

      - name: Lint changed files
        env:
          LINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make lint-docker

      - name: Cache PeatedAPI build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: PeatedAPI/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-swift-6.3-api-${{ hashFiles('PeatedAPI/Package.*') }}-${{ hashFiles('PeatedAPI/Sources/**/*.swift', 'PeatedAPI/Tests/**/*.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-swift-6.3-api-${{ hashFiles('PeatedAPI/Package.*') }}-

      - name: Test PeatedAPI package
        run: make test-api-docker

  core-tests:
    name: PeatedCore package tests
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache PeatedCore build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: PeatedCore/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-core-${{ hashFiles('PeatedCore/Package.*', 'PeatedAPI/Package.*') }}-${{ hashFiles('PeatedCore/Sources/**/*.swift', 'PeatedCore/Tests/**/*.swift', 'PeatedAPI/Sources/**/*.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-core-${{ hashFiles('PeatedCore/Package.*', 'PeatedAPI/Package.*') }}-

      - name: Test PeatedCore package
        run: make test-core

  ios-tests:
    name: iOS app tests
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Xcode build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .derived_data/Build
            .derived_data/ModuleCache.noindex
            .derived_data/SourcePackages
          key: xcode-${{ runner.os }}-${{ runner.arch }}-26.6-${{ hashFiles('Peated/Peated.xcodeproj/project.pbxproj', '**/Package.*') }}-${{ hashFiles('Peated/**/*.swift', 'PeatedCore/**/*.swift', 'PeatedAPI/**/*.swift') }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ runner.arch }}-26.6-${{ hashFiles('Peated/Peated.xcodeproj/project.pbxproj', '**/Package.*') }}-

      - name: Test iOS app
        run: make test-ios SIMULATOR='iPhone 17 Pro'

      - name: Upload iOS test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: .test-results/Peated.xcresult
          if-no-files-found: ignore
          retention-days: 7

  apple-tests:
    name: Apple build and tests
    if: ${{ always() }}
    needs:
      - core-tests
      - ios-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require successful Apple test jobs
        env:
          CORE_TESTS_RESULT: ${{ needs.core-tests.result }}
          IOS_TESTS_RESULT: ${{ needs.ios-tests.result }}
        run: |
          if [ "$CORE_TESTS_RESULT" != 'success' ] || [ "$IOS_TESTS_RESULT" != 'success' ]; then
              echo "PeatedCore package tests: $CORE_TESTS_RESULT" >&2
              echo "iOS app tests: $IOS_TESTS_RESULT" >&2
              exit 1
          fi
